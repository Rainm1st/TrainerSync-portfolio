<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="2300" viewBox="0 0 3400 2300">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#111}
      .sub{font:400 14px Arial,sans-serif;fill:#666}
      .label{font:700 13px Arial,sans-serif;fill:#222}
      .txt{font:400 12px Arial,sans-serif;fill:#555}
      .tiny{font:400 10px Arial,sans-serif;fill:#777}
      .frame{fill:#fff;stroke:#111;stroke-width:2}
      .bar{fill:#f0f0f0;stroke:#999;stroke-width:1.5}
      .blk{fill:#efefef;stroke:#999;stroke-width:1.2}
      .btn{fill:#e7e7e7;stroke:#777;stroke-width:1.2}
      .btnp{fill:#dcdcdc;stroke:#555;stroke-width:1.4}
      .chip{fill:#f5f5f5;stroke:#aaa;stroke-width:1}
      .arrow{stroke:#444;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#444"/>
    </marker>
  </defs>

  <rect width="3400" height="2300" fill="#f7f7f7"/>
  <text x="40" y="54" class="title">TrainerSync Detailed Low-Fi Wireframe Board</text>
  <text x="40" y="80" class="sub">System-aligned draft generated from current demo structure (user + coach + shared auth flow). Drag into Figma and edit as components.</text>

  <text x="40" y="118" class="label">USER FLOW (primary): 01 Sign In -> 02 Register -> 03 Home -> 04 Exercise Library -> 05 Live Training -> 06 Companion Map -> 07 Summary -> 08 Profile</text>
  <text x="40" y="142" class="label">COACH FLOW (primary): 01 Sign In -> 09 Coach Home -> 10 Coach Trainees -> 11 Coach Live Detail -> 12 Coach Messages</text>

  <!-- ========= Row 1 ========= -->
  <!-- 01 Sign In -->
  <g transform="translate(40 180)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">01 Sign In</text>
    <text x="24" y="62" class="txt">Role-based entry</text>
    <rect x="16" y="84" width="218" height="38" rx="8" class="blk"/>
    <text x="28" y="108" class="txt">Role: User / Coach</text>
    <rect x="16" y="132" width="218" height="40" rx="8" class="blk"/>
    <text x="28" y="157" class="txt">Username</text>
    <rect x="16" y="180" width="218" height="40" rx="8" class="blk"/>
    <text x="28" y="205" class="txt">Password</text>
    <rect x="16" y="238" width="218" height="44" rx="8" class="btnp"/>
    <text x="72" y="265" class="label">Continue as User</text>
    <rect x="16" y="292" width="218" height="44" rx="8" class="btn"/>
    <text x="72" y="319" class="label">Continue as Coach</text>
    <rect x="16" y="346" width="218" height="44" rx="8" class="btn"/>
    <text x="74" y="373" class="label">Open Register</text>
    <rect x="16" y="406" width="218" height="78" rx="8" class="chip"/>
    <text x="24" y="430" class="tiny">Access logic</text>
    <text x="24" y="450" class="tiny">- User: normal login / register</text>
    <text x="24" y="468" class="tiny">- Coach: dashboard entry</text>
  </g>

  <!-- 02 Register -->
  <g transform="translate(320 180)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">02 Register</text>
    <text x="24" y="62" class="txt">Create user account</text>
    <rect x="16" y="92" width="218" height="40" rx="8" class="blk"/><text x="28" y="117" class="txt">Username</text>
    <rect x="16" y="140" width="218" height="40" rx="8" class="blk"/><text x="28" y="165" class="txt">Password</text>
    <rect x="16" y="188" width="218" height="40" rx="8" class="blk"/><text x="28" y="213" class="txt">Confirm Password</text>
    <rect x="16" y="246" width="218" height="84" rx="8" class="chip"/>
    <text x="24" y="270" class="tiny">Validation:</text>
    <text x="24" y="288" class="tiny">- empty inputs</text>
    <text x="24" y="306" class="tiny">- mismatch password</text>
    <rect x="16" y="342" width="218" height="44" rx="8" class="btnp"/><text x="88" y="369" class="label">Create</text>
    <rect x="16" y="396" width="218" height="44" rx="8" class="btn"/><text x="74" y="423" class="label">Back Sign In</text>
  </g>

  <!-- 03 Home -->
  <g transform="translate(600 180)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">03 User Home</text>
    <text x="24" y="62" class="txt">Plan + nearby + history</text>
    <rect x="16" y="84" width="218" height="122" rx="8" class="blk"/>
    <text x="24" y="106" class="tiny">Hero card: Today's plan</text>
    <text x="24" y="124" class="tiny">- duration / exercises / readiness</text>
    <text x="24" y="142" class="tiny">- Start session CTA</text>
    <rect x="16" y="214" width="103" height="66" rx="8" class="blk"/>
    <rect x="131" y="214" width="103" height="66" rx="8" class="blk"/>
    <text x="24" y="236" class="tiny">Rest HR</text>
    <text x="139" y="236" class="tiny">Weekly progress</text>
    <rect x="16" y="288" width="218" height="94" rx="8" class="blk"/>
    <text x="24" y="310" class="tiny">Nearby buddies list</text>
    <text x="24" y="328" class="tiny">- name / exercise / bpm</text>
    <rect x="16" y="390" width="218" height="94" rx="8" class="blk"/>
    <text x="24" y="412" class="tiny">Recent sessions</text>
    <text x="24" y="430" class="tiny">- Upper Push / Leg Day ...</text>
  </g>

  <!-- 04 Exercise Library -->
  <g transform="translate(880 180)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">04 Exercise Library</text>
    <text x="24" y="62" class="txt">Search + filters + detail preview</text>
    <rect x="16" y="84" width="218" height="34" rx="8" class="blk"/><text x="24" y="106" class="tiny">Search exercise/muscle/equipment</text>
    <rect x="16" y="126" width="218" height="74" rx="8" class="blk"/>
    <text x="24" y="148" class="tiny">Filter chips</text>
    <text x="24" y="166" class="tiny">Muscle + Equipment</text>
    <rect x="16" y="208" width="103" height="80" rx="8" class="blk"/>
    <rect x="131" y="208" width="103" height="80" rx="8" class="blk"/>
    <text x="24" y="234" class="tiny">Exercise card A</text>
    <text x="139" y="234" class="tiny">Exercise card B</text>
    <rect x="16" y="296" width="218" height="136" rx="8" class="blk"/>
    <text x="24" y="318" class="tiny">Detail panel</text>
    <text x="24" y="336" class="tiny">- media preview (gif/img)</text>
    <text x="24" y="354" class="tiny">- how to perform</text>
    <text x="24" y="372" class="tiny">- programming / breathing</text>
    <rect x="16" y="440" width="102" height="38" rx="8" class="btn"/><text x="56" y="464" class="tiny">Save</text>
    <rect x="132" y="440" width="102" height="38" rx="8" class="btnp"/><text x="154" y="464" class="tiny">Start</text>
  </g>

  <!-- 05 Live Training -->
  <g transform="translate(1160 180)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">05 Live Training</text>
    <text x="24" y="62" class="txt">Realtime metrics + cues</text>
    <rect x="16" y="84" width="218" height="136" rx="8" class="blk"/>
    <text x="24" y="106" class="tiny">Live card: HR + ring + progress</text>
    <text x="24" y="124" class="tiny">Set/Exercise metadata</text>
    <rect x="16" y="228" width="68" height="64" rx="8" class="blk"/>
    <rect x="91" y="228" width="68" height="64" rx="8" class="blk"/>
    <rect x="166" y="228" width="68" height="64" rx="8" class="blk"/>
    <text x="24" y="248" class="tiny">Reps</text><text x="99" y="248" class="tiny">Tempo</text><text x="174" y="248" class="tiny">Elapsed</text>
    <rect x="16" y="300" width="218" height="78" rx="8" class="blk"/>
    <text x="24" y="322" class="tiny">Guidance:</text>
    <text x="24" y="340" class="tiny">Breathing cue + posture cue</text>
    <rect x="16" y="386" width="218" height="58" rx="8" class="blk"/>
    <text x="24" y="408" class="tiny">Encouragement quick actions</text>
    <rect x="16" y="452" width="68" height="34" rx="8" class="btn"/><text x="34" y="474" class="tiny">Pause</text>
    <rect x="91" y="452" width="68" height="34" rx="8" class="btn"/><text x="100" y="474" class="tiny">Companion</text>
    <rect x="166" y="452" width="68" height="34" rx="8" class="btnp"/><text x="178" y="474" class="tiny">Next Set</text>
  </g>

  <!-- 06 Companion -->
  <g transform="translate(1440 180)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">06 Companion Map</text>
    <text x="24" y="62" class="txt">Gym map + live trainees</text>
    <rect x="16" y="84" width="218" height="130" rx="8" class="blk"/>
    <text x="24" y="106" class="tiny">Gym floor map image</text>
    <text x="24" y="124" class="tiny">- dynamic trainee dots</text>
    <text x="24" y="142" class="tiny">- dot labels (name)</text>
    <rect x="16" y="222" width="218" height="88" rx="8" class="blk"/>
    <text x="24" y="244" class="tiny">Active trainees list</text>
    <text x="24" y="262" class="tiny">name + exercise + bpm</text>
    <rect x="16" y="318" width="218" height="52" rx="8" class="blk"/><text x="24" y="348" class="tiny">Trainer presence (online/available)</text>
    <rect x="16" y="378" width="218" height="48" rx="8" class="blk"/><text x="24" y="406" class="tiny">Current sync: you vs coach</text>
    <rect x="16" y="434" width="103" height="50" rx="8" class="btn"/><text x="32" y="463" class="tiny">Quick cue</text>
    <rect x="131" y="434" width="103" height="50" rx="8" class="btnp"/><text x="142" y="463" class="tiny">Send support</text>
  </g>

  <!-- 07 Summary -->
  <g transform="translate(1720 180)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">07 Session Summary</text>
    <text x="24" y="62" class="txt">Metrics + highlights + feedback</text>
    <rect x="16" y="84" width="103" height="56" rx="8" class="blk"/>
    <rect x="131" y="84" width="103" height="56" rx="8" class="blk"/>
    <rect x="16" y="148" width="103" height="56" rx="8" class="blk"/>
    <rect x="131" y="148" width="103" height="56" rx="8" class="blk"/>
    <text x="24" y="106" class="tiny">Duration</text><text x="139" y="106" class="tiny">Exercises</text>
    <text x="24" y="170" class="tiny">Avg HR</text><text x="139" y="170" class="tiny">Peak HR</text>
    <rect x="16" y="212" width="218" height="94" rx="8" class="blk"/>
    <text x="24" y="234" class="tiny">Heart-rate timeline chart</text>
    <rect x="16" y="314" width="218" height="72" rx="8" class="blk"/>
    <text x="24" y="336" class="tiny">Performance highlights</text>
    <text x="24" y="354" class="tiny">3 bullet insights</text>
    <rect x="16" y="394" width="218" height="58" rx="8" class="blk"/>
    <text x="24" y="424" class="tiny">Trainer feedback note</text>
    <rect x="16" y="460" width="103" height="26" rx="6" class="btn"/><text x="38" y="478" class="tiny">Save</text>
    <rect x="131" y="460" width="103" height="26" rx="6" class="btnp"/><text x="158" y="478" class="tiny">Home</text>
  </g>

  <!-- 08 Profile -->
  <g transform="translate(2000 180)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">08 Profile</text>
    <text x="24" y="62" class="txt">Identity + stats + history</text>
    <rect x="16" y="84" width="218" height="82" rx="8" class="blk"/>
    <text x="24" y="106" class="tiny">User name + avatar</text>
    <text x="24" y="124" class="tiny">Total sessions / total time / friends</text>
    <rect x="16" y="174" width="218" height="310" rx="8" class="blk"/>
    <text x="24" y="196" class="tiny">History list</text>
    <text x="24" y="214" class="tiny">- Upper Push</text>
    <text x="24" y="232" class="tiny">- Leg Day</text>
    <text x="24" y="250" class="tiny">- Back & Core</text>
  </g>

  <!-- ========= Row 2 (Coach) ========= -->
  <!-- 09 Coach Home -->
  <g transform="translate(40 760)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">09 Coach Home</text>
    <text x="24" y="62" class="txt">Dashboard overview</text>
    <rect x="16" y="84" width="103" height="64" rx="8" class="blk"/>
    <rect x="131" y="84" width="103" height="64" rx="8" class="blk"/>
    <text x="24" y="106" class="tiny">Trainees</text><text x="139" y="106" class="tiny">Live now</text>
    <rect x="16" y="156" width="218" height="328" rx="8" class="blk"/>
    <text x="24" y="178" class="tiny">Live trainee list</text>
    <text x="24" y="196" class="tiny">- trainee identity</text>
    <text x="24" y="214" class="tiny">- exercise + set + bpm</text>
    <text x="24" y="232" class="tiny">- status normal/alert</text>
  </g>

  <!-- 10 Coach Trainees -->
  <g transform="translate(320 760)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">10 Coach Trainees</text>
    <text x="24" y="62" class="txt">Full roster view</text>
    <rect x="16" y="84" width="218" height="400" rx="8" class="blk"/>
    <text x="24" y="106" class="tiny">Roster cards</text>
    <text x="24" y="124" class="tiny">- live users openable</text>
    <text x="24" y="142" class="tiny">- offline row shown</text>
  </g>

  <!-- 11 Coach Live Detail -->
  <g transform="translate(600 760)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">11 Coach Live Detail</text>
    <text x="24" y="62" class="txt">One trainee monitoring</text>
    <rect x="16" y="84" width="218" height="136" rx="8" class="blk"/>
    <text x="24" y="106" class="tiny">Live status + bpm + elapsed</text>
    <text x="24" y="124" class="tiny">chart line placeholder</text>
    <rect x="16" y="228" width="218" height="152" rx="8" class="blk"/>
    <text x="24" y="250" class="tiny">Coach actions</text>
    <text x="24" y="268" class="tiny">- send cue</text>
    <text x="24" y="286" class="tiny">- rest cue</text>
    <text x="24" y="304" class="tiny">- applause burst</text>
    <text x="24" y="322" class="tiny">- open chat</text>
  </g>

  <!-- 12 Coach Messages -->
  <g transform="translate(880 760)">
    <rect class="frame" width="250" height="500" rx="16"/>
    <rect x="16" y="16" width="218" height="30" rx="8" class="bar"/>
    <text x="24" y="36" class="label">12 Coach Messages</text>
    <text x="24" y="62" class="txt">Conversation with trainee</text>
    <rect x="16" y="84" width="218" height="340" rx="8" class="blk"/>
    <text x="24" y="106" class="tiny">Chat stack</text>
    <text x="24" y="124" class="tiny">- trainee bubble</text>
    <text x="24" y="142" class="tiny">- coach bubble</text>
    <rect x="16" y="432" width="152" height="44" rx="8" class="blk"/>
    <rect x="176" y="432" width="58" height="44" rx="8" class="btnp"/>
    <text x="26" y="458" class="tiny">Type a message...</text>
    <text x="192" y="458" class="tiny">Send</text>
  </g>

  <!-- Flow map / relation board -->
  <g transform="translate(1180 760)">
    <rect class="frame" width="1080" height="500" rx="16"/>
    <text x="24" y="34" class="label">Navigation and Interaction Map (aligned with current demo)</text>
    <rect x="24" y="56" width="326" height="178" rx="10" class="chip"/>
    <text x="38" y="82" class="tiny">User navigation</text>
    <text x="38" y="102" class="tiny">Bottom nav: Home / Exercise / Live / Companion / Profile</text>
    <text x="38" y="122" class="tiny">Cross links:</text>
    <text x="38" y="140" class="tiny">Home -> Live, Companion, Summary</text>
    <text x="38" y="158" class="tiny">Exercise -> Live</text>
    <text x="38" y="176" class="tiny">Live -> Companion or Summary</text>

    <rect x="372" y="56" width="326" height="178" rx="10" class="chip"/>
    <text x="386" y="82" class="tiny">Coach navigation</text>
    <text x="386" y="102" class="tiny">Bottom nav: Home / Trainees / Live Detail / Messages</text>
    <text x="386" y="122" class="tiny">Coach Home -> Live Detail</text>
    <text x="386" y="140" class="tiny">Trainees -> Live Detail</text>
    <text x="386" y="158" class="tiny">Live Detail -> Messages</text>

    <rect x="720" y="56" width="336" height="178" rx="10" class="chip"/>
    <text x="734" y="82" class="tiny">Realtime interactions</text>
    <text x="734" y="102" class="tiny">- Heart-rate alert toggle</text>
    <text x="734" y="120" class="tiny">- Next set progression</text>
    <text x="734" y="138" class="tiny">- Toast and emoji burst</text>
    <text x="734" y="156" class="tiny">- Gym map dynamic dots</text>
    <text x="734" y="174" class="tiny">- Coach message dispatch</text>

    <rect x="24" y="254" width="1032" height="224" rx="10" class="blk"/>
    <text x="40" y="282" class="label">Low-fi fidelity target (for coursework)</text>
    <text x="40" y="306" class="txt">1) Keep grayscale wireframe style (avoid polished colors and final visual effects).</text>
    <text x="40" y="328" class="txt">2) Preserve information architecture and component names from your current system.</text>
    <text x="40" y="350" class="txt">3) Show major states: normal live state and HR alert state.</text>
    <text x="40" y="372" class="txt">4) Keep map-related module explicit: floor map + trainee list + trainer availability.</text>
    <text x="40" y="394" class="txt">5) Include both user and coach flows on one board for portfolio clarity.</text>
    <text x="40" y="416" class="txt">6) In Figma, convert each screen into frame/component for clickable prototype links.</text>
    <text x="40" y="448" class="tiny">File generated for direct Figma import by drag-and-drop.</text>
  </g>

  <!-- bottom notes -->
  <text x="40" y="1320" class="label">Suggested prototype links after import:</text>
  <text x="40" y="1344" class="txt">01->02, 01->03, 01->09, 03->04->05->07->03, 03->06, 06->09, 09->10->11->12</text>
  <text x="40" y="1368" class="txt">This board is intentionally low-fi and text-accurate to current `demo/trainersync_demo.html` screens.</text>

  <!-- arrows between first row -->
  <path class="arrow" d="M290 430 H315"/>
  <path class="arrow" d="M570 430 H595"/>
  <path class="arrow" d="M850 430 H875"/>
  <path class="arrow" d="M1130 430 H1155"/>
  <path class="arrow" d="M1410 430 H1435"/>
  <path class="arrow" d="M1690 430 H1715"/>
  <path class="arrow" d="M1970 430 H1995"/>
  <path class="arrow" d="M2200 520 C2280 640 180 700 165 760"/>

  <!-- coach row arrows -->
  <path class="arrow" d="M290 1010 H315"/>
  <path class="arrow" d="M570 1010 H595"/>
  <path class="arrow" d="M850 1010 H875"/>
</svg>
